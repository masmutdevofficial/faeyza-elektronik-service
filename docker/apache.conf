ServerTokens Prod
ServerSignature Off
ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
